<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azure费用查询</title>
    <script>
      if (localStorage.getItem("color-theme") === "dark") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <main class="page">
      <header class="nav">
        <div class="nav-side nav-left-slot">
          <button id="openSettingsBtn" type="button" class="icon-gear-btn" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10.4 2h3.2l.5 2.2a7.9 7.9 0 0 1 1.8.8l2-1.2 2.3 2.3-1.2 2a7.9 7.9 0 0 1 .8 1.8L22 10.4v3.2l-2.2.5a7.9 7.9 0 0 1-.8 1.8l1.2 2-2.3 2.3-2-1.2a7.9 7.9 0 0 1-1.8.8L13.6 22h-3.2l-.5-2.2a7.9 7.9 0 0 1-1.8-.8l-2 1.2-2.3-2.3 1.2-2a7.9 7.9 0 0 1-.8-1.8L2 13.6v-3.2l2.2-.5a7.9 7.9 0 0 1 .8-1.8l-1.2-2 2.3-2.3 2 1.2a7.9 7.9 0 0 1 1.8-.8L10.4 2Z" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
        </div>
        <div class="nav-title-group">
          <h1 class="nav-title">Azure费用查询</h1>
          <p id="cacheInfo" class="query-status-message nav-status-message"></p>
        </div>
        <div class="nav-side nav-action-slot">
          <button id="themeToggleBtn" type="button" class="icon-gear-btn icon-theme-btn" title="切换主题" aria-label="切换主题">
            <svg id="themeToggleLightIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 2.75V5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M12 18.9V21.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M5.46 5.46L7.13 7.13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M16.87 16.87L18.54 18.54" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M2.75 12H5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M18.9 12H21.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M5.46 18.54L7.13 16.87" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M16.87 7.13L18.54 5.46" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <svg id="themeToggleDarkIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M20.4 14.2A8.5 8.5 0 1 1 9.8 3.6a6.9 6.9 0 0 0 10.6 10.6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.8 -1.8) scale(1.18)"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="panel panel--query">
        <div class="query-condition-layout">
          <div class="query-condition-left">
            <h2>查询范围</h2>
          </div>
          <div class="query-condition-right">
            <div class="query-preset-group" role="group" aria-label="时间范围">
              <button type="button" class="query-preset-btn" data-preset="last-month">上月</button>
              <button type="button" class="query-preset-btn" data-preset="this-month">本月</button>
              <button type="button" class="query-preset-btn" data-preset="this-quarter">本季度</button>
              <button type="button" class="query-preset-btn" data-preset="this-year">本年度</button>
              <button type="button" class="query-preset-btn" data-preset="yesterday">昨天</button>
              <button type="button" class="query-preset-btn" data-preset="custom">自定义范围</button>
            </div>
            <div id="customRangeRow" class="custom-range-row" hidden>
              <label for="startDate">开始时间</label>
              <input id="startDate" type="date" required />
              <label for="endDate">结束时间</label>
              <input id="endDate" type="date" required />
            </div>
            <button id="queryBtn" type="button" class="query-btn-right">查询</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="summary-overview-layout">
          <div class="summary-overview-left">
            <h2>统计概览</h2>
          </div>
          <div class="grid summary-grid" id="summaryGrid"></div>
        </div>

        <div class="summary-dimension-divider" aria-hidden="true"></div>

        <div class="dimension-tabs-wrapper">
          <div class="dimension-title-left">
            <h2>统计维度</h2>
          </div>
          <div class="dimension-tabs dimension-tabs-center" id="dimensionTabs" role="tablist" aria-label="维度切换">
            <button type="button" class="dimension-tab active" data-dimension="subscription" role="tab" aria-selected="true">订阅</button>
            <button type="button" class="dimension-tab" data-dimension="daily" role="tab" aria-selected="false">按天</button>
            <button type="button" class="dimension-tab" data-dimension="resourceType" role="tab" aria-selected="false">资源</button>
            <button type="button" class="dimension-tab" data-dimension="date" role="tab" aria-selected="false">详单</button>
          </div>
          <div class="dimension-downloads">
            <button id="downloadSubscriptionBtn" type="button" class="secondary dimension-download-btn">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>下载</span>
            </button>
            <button id="downloadDailyBtn" type="button" class="secondary dimension-download-btn">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>下载</span>
            </button>
            <button id="downloadResourceTypeBtn" type="button" class="secondary dimension-download-btn">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>下载</span>
            </button>
            <button id="downloadDateBtn" type="button" class="secondary dimension-download-btn">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>下载</span>
            </button>
          </div>
        </div>

        <div class="dimension-card" data-dimension-panel="subscription">
          <div class="table-wrap" id="subscriptionTableWrap"></div>
        </div>

        <div class="dimension-card" data-dimension-panel="daily">
          <div class="table-wrap" id="dailyTableWrap"></div>
        </div>

        <div class="dimension-card" data-dimension-panel="resourceType">
          <div class="table-wrap" id="resourceTypeTableWrap"></div>
        </div>

        <div class="dimension-card" data-dimension-panel="date">
          <div class="table-wrap" id="dateTableWrap"></div>
        </div>
      </section>

      <div id="settingsModal" class="settings-modal" aria-hidden="true">
        <div class="settings-card" role="dialog" aria-modal="true">
          <button id="closeSettingsBtn" type="button" class="icon-close-btn settings-close-btn" aria-label="关闭">×</button>
          <div class="settings-card-body">
            <div class="settings-section-card">
              <div class="settings-section-head">
                <div class="settings-section-title">认证参数设置</div>
              </div>
              <input id="importAuthParamsInput" type="file" accept=".csv,text/csv" hidden />
              <table class="auth-settings-table">
                <thead>
                  <tr>
                    <th>No.</th>
                    <th>APP_Client_ID</th>
                    <th>APP_Client_Secret</th>
                    <th>Tenant_ID</th>
                    <th>Tenant_Name</th>
                    <th>Subscription_ID</th>
                    <th class="auth-table-action-col">操作</th>
                  </tr>
                </thead>
                <tbody id="authTableBody">
                </tbody>
              </table>
              <div class="settings-section-actions auth-settings-actions" aria-label="认证参数操作">
                <div class="auth-settings-tips">
                  <span class="auth-settings-tip-title">注意事项：</span>
                  <span class="auth-settings-tip">1.添加的访问凭据及查询查询结果缓存在浏览器localStorage中，为保证安全，建议使用后清除本地缓存。</span>
                  <span class="auth-settings-tip">2.不建议添加过多访问凭据，以免影响查询速度。</span>
                </div>
                <button id="addAuthRowBtn" type="button" class="settings-inline-btn">添加行</button>
                <button id="exportAuthParamsBtn" type="button" class="settings-inline-btn">导出</button>
                <button id="importAuthParamsBtn" type="button" class="settings-inline-btn">导入</button>
              </div>
            </div>

          </div>
          <div class="settings-card-footer">
            <button id="deleteAuthParamsBtn" type="button" class="delete-auth-btn">删除本地缓存</button>
            <p id="settingsModalMessage" class="message"></p>
            <button id="saveSettingsBtn" type="button">保存认证参数</button>
          </div>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/query.js') }}"></script>
  </body>
</html>
